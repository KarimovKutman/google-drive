spring.application.name=google-drivve

spring.profiles.default=local

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/google_drive_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

# JWT configuration. The signing secret is supplied by application-local.properties or an environment variable.
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration-ms=900000
app.jwt.refresh-token-expiration-ms=604800000

spring.jpa.open-in-view=false
